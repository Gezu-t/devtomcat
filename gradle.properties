# JVM Configuration
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US

# Plugin Metadata
pluginName=DevTomcat
pluginGroup=com.dev.idea.plugins.tomcat
pluginVersion=1.2.0

# IntelliJ Platform Compatibility
# sinceBuild lowered to 242.* in 1.1.2 to widen reach to IntelliJ 2024.2+
# users. The 3-arg SimpleListCellRenderer.create form we rely on landed in
# 2024.2, so 242.* is the safe floor — going to 241.* would force a shim.
# All other APIs we touch (RunConfiguration, ExecutionEnvironment, etc.)
# have been stable across the 242 → 262 window.
#
# untilBuild stays at 262.*: the verifier matrix in build.gradle.kts pins
# 2026.1 as the upper bound (the IntelliJ Platform Gradle Plugin 2.11.0
# cannot resolve 2026.2 EAP snapshot artifacts — see build.gradle.kts);
# we rely on the platform's binary-compat policy within a yearly cycle
# for the 262 claim. Revisit when 2026.2 reaches stable.
pluginSinceBuild=242
pluginUntilBuild=262.*

# Build Platform
platformType=IC
platformVersion=2025.1.7

# JDK Configuration
jdkVersion=17
compatibleJdkVersion=17

# Gradle
gradleVersion=8.13

# Plugin Dependencies
# org.jetbrains.idea.maven is bundled in the IDE; it's added here so the typed
# MavenModelProvider impl (devtomcat-maven.xml) compiles against the real Maven
# API. The runtime dependency is declared optional in plugin.xml, so the plugin
# still loads on installs without the Maven plugin (the impl is simply not registered).
platformPlugins=com.intellij.java,Coverage,org.jetbrains.idea.maven

# Kotlin
kotlin.stdlib.default.dependency=false