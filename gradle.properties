# JVM Configuration
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US

# Plugin Metadata
pluginName=DevTomcat
pluginGroup=com.dev.idea.plugins.tomcat
pluginVersion=1.1.1

# IntelliJ Platform Compatibility
# sinceBuild raised to 2025.1 in 1.0.8: the 2024.1 test permutation added
# cost without unlocking anything (the 2026.1 dashboard builder API is not
# available on 2024.1/2025.1 anyway). Bumping halves the verifier matrix
# and lets the next release target the 2026.1-only APIs cleanly.
#
# untilBuild raised to 262.* in 1.0.14: 2026.2 EAP opened in May 2026 and
# the marketplace was blocking the install button for users on the new
# EAP builds because 261.* did not cover them. The verifier matrix in
# build.gradle.kts is pinned to the latest stable 2026.1 release (the
# IntelliJ Platform Gradle Plugin 2.11.0 cannot resolve 2026.2 EAP
# snapshot artifacts — see the comment in build.gradle.kts for detail)
# and we rely on the platform's binary-compat policy within a yearly
# cycle for the 262 claim. Revisit when 2026.2 reaches stable release
# or when the Gradle plugin's snapshot resolution is fixed.
pluginSinceBuild=251.29188.11
pluginUntilBuild=262.*

# Build Platform
platformType=IC
platformVersion=2025.1.7

# JDK Configuration
jdkVersion=17
compatibleJdkVersion=17

# Gradle
gradleVersion=8.13

# Plugin Dependencies
platformPlugins=com.intellij.java,Coverage

# Kotlin
kotlin.stdlib.default.dependency=false